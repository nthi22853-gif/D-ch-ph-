name: Build Android APK
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Restore release keystore when configured
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        shell: bash
        env: { KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }} }
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Build Release APK when signing is configured
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleTranslator-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleTranslator-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          
